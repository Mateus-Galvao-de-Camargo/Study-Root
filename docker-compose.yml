# Ambiente local de desenvolvimento.
# Em produção (Render/Fly) o app conecta direto no Neon via DATABASE_URL — sem este compose.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: study_root
      DB_USER: study_root
      DB_PASS: dev_password_change_me
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Em dev, montar o código facilita iteração rápida sem rebuild.
      - ./src:/var/www/html
      # Anonymous volume: preserva o vendor/ instalado no build.
      # Sem isso, o bind mount acima sobrescreveria a pasta vendor com vazio,
      # quebrando o require_once vendor/autoload.php no migrate.
      - /var/www/html/vendor
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_root
      POSTGRES_USER: study_root
      POSTGRES_PASSWORD: dev_password_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_root -d study_root"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
